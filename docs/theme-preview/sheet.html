<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>JQ Tools Factory — 配色方案候选</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1420px;padding:14px;background:#0e0f11;color:#e8eaed;
  font-family:'IBM Plex Sans','Segoe UI',system-ui,'Microsoft YaHei',sans-serif}
h1{font-size:13px;font-weight:600;letter-spacing:.06em;margin-bottom:12px}
h1 span{color:#8b949e;font-weight:400;letter-spacing:0;margin-left:8px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.tile{background:#16181c;border:1px solid #23262c;border-radius:7px;overflow:hidden}
.lab{display:flex;align-items:baseline;gap:8px;padding:7px 10px;
  border-bottom:1px solid #23262c;font-size:11px;font-weight:600}
.lab .k{color:#fff;background:#2a2e35;border-radius:3px;padding:1px 6px;
  font-family:'IBM Plex Mono',Consolas,monospace;font-size:10px}
.lab em{font-style:normal;color:#8b949e;font-weight:400;font-size:10px;margin-left:auto}
.tile img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<h1>JQ Tools Factory — 配色方案候选 <span>6 选 1 · 同一布局套不同配色，便于横向对比</span></h1>
<div class="grid">
  <div class="tile"><div class="lab"><span class="k">A</span>石墨青 <em>中性石墨 + 青</em></div><img src="theme-A.png"></div>
  <div class="tile"><div class="lab"><span class="k">B</span>深青绿 <em>墨绿 + 薄荷</em></div><img src="theme-B.png"></div>
  <div class="tile"><div class="lab"><span class="k">C</span>纯黑冰蓝 <em>纯黑 + 冰蓝</em></div><img src="theme-C.png"></div>
  <div class="tile"><div class="lab"><span class="k">D</span>暖炭琥珀 <em>暖炭 + 琥珀</em></div><img src="theme-D.png"></div>
  <div class="tile"><div class="lab"><span class="k">E</span>浅色仪器 <em>亮底 + 青蓝</em></div><img src="theme-E.png"></div>
  <div class="tile"><div class="lab"><span class="k">F</span>磷光绿 <em>终端荧光绿</em></div><img src="theme-F.png"></div>
</div>
</body>
</html>
